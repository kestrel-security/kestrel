[tool.uv]
# Keep existing checkouts working; CI/images use 0.12.18, also supported by
# Dependabot. Accept both compatible minor lines without unbounded upgrades.
required-version = ">=0.11.30,<0.13"
# Floor transitive packages the image scan blocks on. Requests pulls urllib3
# without a lower bound tight enough for the current advisories.
constraint-dependencies = ["urllib3>=2.8.0"]

[tool.uv.workspace]
members = [
    "kestrel",
    "apps/api",
    "apps/worker",
    "connectors/github",
    "connectors/google_workspace",
    "connectors/slack",
    "connectors/okta",
]

[tool.ruff]
line-length = 125
target-version = "py312"
extend-exclude = [
    "migrations/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "C4", "SIM", "PT", "RUF"]
ignore = [
    "UP042",  # (str, Enum) is intentional here: plain str values needed for JSON/Pydantic interop
    "RUF001",  # typographic quotes and dashes in user-facing copy are deliberate
    "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI and Typer declare parameters through call defaults by design.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "kestrel_api.deps.require_role",
    "typer.Argument",
    "typer.Option",
]

[tool.ruff.lint.per-file-ignores]
# Brand asset generators embed SVG path data as string literals. Wrapping a
# path string does not make it readable, it just makes it wrong.
"brand/*.py" = ["E501"]
# The flake8-pytest-style rules key off function names, so they misfire on
# application code that happens to define `test_*` functions (e.g. the API's
# "test connection" and "test policy" handlers). Apply them to tests only.
"apps/**" = ["PT"]
"kestrel/src/**" = ["PT"]
"connectors/*/src/**" = ["PT"]
"packs/**" = ["PT"]
"scripts/**" = ["PT"]
"brand/**" = ["PT"]
"examples/*/src/**" = ["PT"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers --strict-config"
testpaths = ["tests", "examples"]

# Test module identity. Under `--import-mode=importlib` pytest names a test
# module after its path relative to rootdir -- `examples.custom-connector.tests
# .test_collection_identity` -- which is unique by construction, so two files
# sharing a basename cannot collide.
#
# That holds only while test directories have no `__init__.py`. An `__init__.py`
# makes pytest name the module from the package root instead, and a package root
# short of the repository root truncates the name: with `connectors/*/tests/
# __init__.py` (and no `connectors/github/__init__.py` above it), both
# `connectors/github/tests/test_normalizer.py` and `connectors/okta/tests/
# test_normalizer.py` become `tests.test_normalizer`, the second import gets the
# first back out of sys.modules, and pytest runs the first file's body twice
# under two node ids while the second file never executes -- green, and wrong.
# That is the failure the old `norecursedirs = ["examples", ...]` was working
# around instead of fixing.
#
# So: no `__init__.py` in test directories; share helpers through
# `kestrel.testing`, not through test-package imports. `tests/unit/`,
# `tests/integration/` and `examples/custom-connector/tests/` each hold a
# `test_collection_identity.py`: three same-basename modules that assert their
# own identity, so a regression here fails a test instead of silently skipping
# one. `consider_namespace_packages` stays off: it would make pytest try to
# import intermediate directories as namespace packages, which is a slower path
# to the same names.
consider_namespace_packages = false

# Defaults plus the trees that hold third-party or vendored `*_test.py` files
# (a local .pnpm-store carries node-gyp's ninja_test.py). The `.*` entry also
# keeps pytest out of hidden directories such as local tool state or nested git
# worktrees, each of which can contain a full checkout.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "{arch}", "node_modules", "venv", ".venv", ".pnpm-store", ".pnpm-local-store", ".vendor-tgz", "logs"]

markers = [
    "unit: Tier 1. Pure logic -- no DB, no network, no subprocess. Auto-applied under tests/unit/, connectors/*/tests/ and examples/*/tests/.",
    "integration: Tier 2. Real Postgres session, API via TestClient, fixture transports. Auto-applied under tests/integration/.",
    "system: Tier 3. CLI end-to-end, migration replay, compose smoke. Auto-applied under tests/system/.",
    "live: Tier 4. Needs real tenant credentials. Never runs in the PR gate.",
]

# A test that hangs should fail, not occupy a CI runner for an hour. Generous
# against the tier budgets (Tier 2 is <3 min for the whole tier at -n auto).
timeout = 60

filterwarnings = [
    "default",
    # Kestrel's own deprecations are a bug the moment they appear in a test run;
    # third-party ones are noise we do not control. The module field is a regex
    # matched against where the warning is raised, so `kestrel.*` covers
    # `kestrel_api` and `kestrel_worker` too.
    "error::DeprecationWarning:kestrel.*",
    "error::PendingDeprecationWarning:kestrel.*",
]

[tool.coverage.run]
branch = true
source = ["kestrel/src/kestrel", "apps/api/src/kestrel_api", "apps/worker/src/kestrel_worker", "connectors"]
omit = ["*/tests/*", "*/migrations/*"]
# xdist workers each write their own data file; without these the combined
# report only reflects whichever worker finished last.
parallel = true
concurrency = ["multiprocessing", "thread"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "\\.\\.\\."]
# A ratchet, not a target. Raise it when coverage rises; never lower it to make
# a build pass.
#
# Deleting the fully-dead `investigate`, `inventory`, and `risks` packages moved
# the real figure from the low 40s to 56%: they were counted but unreachable, so
# the old number measured dead code as much as it measured testing.
#
# Tests for `gitops`, the dashboard query DSL, graph exploration, the worker
# tasks, connector health checks and the thinner routers took the measured
# total (Tiers 1+2) from 69.5% to 77.7%.
fail_under = 77

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # -n auto over per-worker databases; the old suite ran single-process.
    "pytest-xdist>=3.8",
    # Two seeds in CI: order dependence in the old suite was demonstrated, not
    # suspected.
    "pytest-randomly>=5.0.0",
    "pytest-timeout>=2.3",
    "pytest-cov>=5.0",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "alembic>=1.19.1",
]
