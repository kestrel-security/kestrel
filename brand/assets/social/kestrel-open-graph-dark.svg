  <text x="330" y="288" fill="#F8FAFC" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="116" font-weight="600" letter-spacing="-2">Kestrel</text>
  <text x="98" y="430" fill="#F8FAFC" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="52" font-weight="500" letter-spacing="-1.4">Open-source security for SaaS.</text>
  <text x="100" y="490" fill="#F8FAFC" fill-opacity=".58" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="500">Posture · identity · access · evidence</text>
