    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(260 110) rotate(36) scale(650 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7441F0" stop-opacity=".26"/>
