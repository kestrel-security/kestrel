# gitleaks configuration for Kestrel (gitleaks >= 8.25 for `[[allowlists]]`).
#
# Extends the default ruleset with rules for the credentials Kestrel itself
# handles. Every allowlist entry must name a reason; never add an entry to hide
# a real credential. Rotate first, then clean up.

[extend]
useDefault = true

# --- Kestrel-specific rules -------------------------------------------------

[[rules]]
id = "kestrel-master-key"
description = "KESTREL_MASTER_KEY assigned a base64-encoded 32-byte key"
# 32 bytes encode to 43 base64 characters plus one `=` of padding.
regex = '''KESTREL_MASTER_KEY["']?\s*[:=]\s*["']?([A-Za-z0-9+/_-]{43}=)'''
secretGroup = 1
keywords = ["kestrel_master_key"]

[[rules.allowlists]]
description = "Deliberately fake CI-only master key: base64(\"test-master-key-for-ci-only!!!!!\")"
regexes = ['''dGVzdC1tYXN0ZXIta2V5LWZvci1jaS1vbmx5ISEhISE=''']

[[rules]]
id = "okta-ssws-api-token"
description = "Okta API token in an SSWS Authorization header value"
# Okta API tokens are 42 characters and start with 00.
regex = '''\bSSWS\s+(00[A-Za-z0-9_-]{40})\b'''
secretGroup = 1
keywords = ["ssws"]

[[rules]]
id = "atlassian-api-token-atatt"
description = "Atlassian API token (ATATT prefix)"
regex = '''\b(ATATT[A-Za-z0-9_=-]{180,200})\b'''
secretGroup = 1
keywords = ["atatt"]

# --- Global allowlists --------------------------------------------------------

[[allowlists]]
description = "Known false positives"
regexes = [
  # Tailwind colour utility strings in the Explore components trip the
  # generic-api-key entropy heuristic ("bg-fuchsia-100 text-fuchsia-900 ...").
  '''^bg-[a-z]+-[0-9]{2,3}$''',
  # Deliberately fake CI-only master key used by the GitOps example workflow:
  # base64("test-master-key-for-ci-only!!!!!"). Not a credential.
  '''dGVzdC1tYXN0ZXIta2V5LWZvci1jaS1vbmx5ISEhISE=''',
  # Placeholder credentials in tests, exact values only: a counting-digits
  # "GitHub token", a non-JWT "Google access token", and PEM wrappers whose
  # body is "MIIB" or "abc" (tests of PEM newline normalisation).
  '''^ghp_0123456789abcdef$''',
  '''^ya29\.preminted$''',
  '''-----BEGIN PRIVATE KEY-----\\\\n(?:MIIB|abc)\\\\n-----END PRIVATE KEY-----''',
]

[[allowlists]]
description = "Lockfiles, and ignored output that `gitleaks dir` reads because it does not honour .gitignore"
paths = [
  # Integrity hashes, not secrets.
  '''(^|/)uv\.lock$''',
  '''(^|/)pnpm-lock\.yaml$''',
  # Build and dependency output; nothing under these paths is committed.
  '''(^|/)\.next/''',
  '''(^|/)node_modules/''',
  '''(^|/)__pycache__/''',
  '''(^|/)\.venv/''',
  '''(^|/)\.pnpm-store/''',
  '''(^|/)htmlcov/''',
  # Local run logs at the repository root only (`make` and `kestrel demo`
  # write there). A logs/ directory anywhere else stays in scope.
  '''^logs/''',
]
# Local .env files are deliberately not allowlisted here: path allowlists apply
# to `gitleaks git` as well, so an entry would hide a committed .env. The
# working-tree scan in scripts/oss-hygiene.sh adds that exemption for itself.
