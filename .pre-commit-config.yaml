# Optional local hooks: `uvx pre-commit install`. CI runs the same checks, so
# skipping these never lets anything through; they just fail faster.
#
# Ruff runs through `uv run` so the hook uses the version pinned in uv.lock,
# never a second copy that can drift from CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: end-of-file-fixer
        exclude: '(^|/)fixtures/|\.svg$|^docs/api\.md$'
      - id: trailing-whitespace
        exclude: '(^|/)fixtures/|\.svg$|\.md$|^migrations/versions/'
      - id: check-yaml

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: web-lint
        name: web lint
        entry: pnpm --filter kestrel-web lint
        language: system
        files: '^apps/web/'
        pass_filenames: false
