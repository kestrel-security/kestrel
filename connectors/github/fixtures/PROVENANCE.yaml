# Fixture provenance: where every field that produces a setting comes from.
# Format and rationale: see connectors/google_workspace/fixtures/PROVENANCE.yaml.
#
# GitHub is the connector that did *not* leak a fabricated setting, but its
# organization fixture carried four fields `GET /orgs/{org}` does not return --
# saml_enabled, is_ip_allow_list_enabled, oauth_app_restrictions_enabled,
# audit_log_streaming_configured. Nothing read them, so nothing broke. They were
# removed anyway, and this file is what stops the next one being read.
#
# Per-repository object types are collected as a wrapper: the collector pairs
# the repository with the API response under a key of its own choosing. Those
# wrapper keys are `synthetic` -- the provider response is nested inside them.

sources:
  organization:
    endpoint: GET /orgs/{org}
    docs: https://docs.github.com/en/rest/orgs/orgs#get-an-organization
    returns:
      - default_repository_permission
      - members_can_create_pages
      - members_can_create_private_repositories
      - members_can_create_public_pages
      - members_can_create_public_repositories
      - members_can_create_repositories
      - members_can_fork_private_repositories
      - two_factor_requirement_enabled
      - web_commit_signoff_required
    synthetic: {}

  actions_permission:
    endpoint: GET /orgs/{org}/actions/permissions + /actions/permissions/workflow
    docs: https://docs.github.com/en/rest/actions/permissions#get-github-actions-permissions-for-an-organization
    # The collector merges the two responses into one object before normalizing:
    # the first two fields come from the permissions call, the second two from
    # the workflow-permissions call.
    returns:
      - allowed_actions
      - can_approve_pull_request_reviews
      - default_workflow_permissions
      - enabled_repositories
    synthetic: {}

  runner_group:
    endpoint: GET /orgs/{org}/actions/runner-groups
    docs: https://docs.github.com/en/rest/actions/self-hosted-runner-groups
    returns: [allows_public_repositories, visibility]
    synthetic: {}

  self_hosted_runner:
    endpoint: GET /orgs/{org}/actions/runners
    docs: https://docs.github.com/en/rest/actions/self-hosted-runners
    returns: [labels, name, os, status]
    synthetic: {}

  actions_secret:
    endpoint: GET /orgs/{org}/actions/secrets
    docs: https://docs.github.com/en/rest/actions/secrets
    # Names and visibility only; GitHub never returns secret values.
    returns: [visibility]
    synthetic: {}

  actions_variable:
    endpoint: GET /orgs/{org}/actions/variables
    docs: https://docs.github.com/en/rest/actions/variables
    # GitHub *does* return `value` here; the collector drops it before it
    # reaches a RawObject, so it is deliberately absent from this list.
    returns: [visibility]
    synthetic: {}

  org_webhook:
    endpoint: GET /orgs/{org}/hooks
    docs: https://docs.github.com/en/rest/orgs/webhooks
    # `config` is redacted to host and scheme at collection; webhook URLs
    # routinely carry a credential in the path.
    returns: [active, config, events]
    synthetic: {}

  credential_authorization:
    endpoint: GET /orgs/{org}/credential-authorizations
    docs: https://docs.github.com/en/rest/orgs/orgs#list-saml-sso-authorizations-for-an-organization
    returns:
      - credential_accessed_at
      - credential_authorized_at
      - credential_type
      - login
      - scopes
    synthetic: {}

  org_ruleset:
    endpoint: GET /orgs/{org}/rulesets
    docs: https://docs.github.com/en/rest/orgs/rules
    returns: [enforcement, name, target]
    synthetic: {}

  security_manager:
    endpoint: GET /orgs/{org}/security-managers
    docs: https://docs.github.com/en/rest/orgs/security-managers
    returns: [slug]
    synthetic: {}

  org_invitation:
    endpoint: GET /orgs/{org}/invitations
    docs: https://docs.github.com/en/rest/orgs/members#list-pending-organization-invitations
    returns: [created_at, inviter, login, role]
    synthetic: {}

  pat_request:
    endpoint: GET /orgs/{org}/personal-access-token-requests
    docs: https://docs.github.com/en/rest/orgs/personal-access-tokens
    returns: [created_at, owner, permissions_added, repository_selection]
    synthetic: {}

  repo_security_analysis:
    endpoint: GET /orgs/{org}/repos
    docs: https://docs.github.com/en/rest/repos/repos#list-organization-repositories
    # Read off the repository object the list call already returned -- free, and
    # covers every repository regardless of the deep-scan tier.
    returns: [security_and_analysis]
    synthetic: {}

  repo_branch_protection:
    endpoint: GET /repos/{owner}/{repo}/branches/{branch}/protection
    docs: https://docs.github.com/en/rest/branches/branch-protection
    returns: []
    synthetic:
      protection: The API response, nested by the collector alongside the repository.
      branch: The default branch name the collector asked about.
      protected: >-
        Collector-computed. A 404 from the protection endpoint means the branch
        is genuinely unprotected, which is the finding, so it is recorded as
        false rather than dropped for lack of a payload.

  repo_ruleset:
    endpoint: GET /repos/{owner}/{repo}/rulesets
    docs: https://docs.github.com/en/rest/repos/rules
    returns: []
    synthetic:
      ruleset: The API response, nested by the collector alongside the repository.

  repo_webhook:
    endpoint: GET /repos/{owner}/{repo}/hooks
    docs: https://docs.github.com/en/rest/repos/webhooks
    returns: []
    synthetic:
      hook: >-
        The API response, nested by the collector alongside the repository, with
        the destination URL redacted to host and scheme.

  deploy_key:
    endpoint: GET /repos/{owner}/{repo}/keys
    docs: https://docs.github.com/en/rest/deploy-keys
    returns: []
    synthetic:
      key: The API response, nested by the collector alongside the repository.

  repo_environment:
    endpoint: GET /repos/{owner}/{repo}/environments
    docs: https://docs.github.com/en/rest/deployments/environments
    returns: []
    synthetic:
      environment: The API response, nested by the collector alongside the repository.

  repo_actions_permission:
    endpoint: GET /repos/{owner}/{repo}/actions/permissions
    docs: https://docs.github.com/en/rest/actions/permissions
    returns: []
    synthetic:
      permissions: The API response, nested by the collector alongside the repository.

  secret_scanning_alert:
    endpoint: GET /repos/{owner}/{repo}/secret-scanning/alerts
    docs: https://docs.github.com/en/rest/secret-scanning
    returns: []
    synthetic:
      open_alert_count: >-
        Collector-computed count of open alerts. Alert contents are never
        collected -- enablement and counts are posture, alert bodies are ASPM.

  # --- Extended coverage ---

  org_ip_allow_list:
    endpoint: GraphQL query (ipAllowListEnabledSetting + ipAllowListEntries)
    docs: https://docs.github.com/en/graphql/reference/objects#organization
    returns: []
    synthetic:
      enabled_setting: >-
        The raw GraphQL ipAllowListEnabledSetting enum value (ENABLED/DISABLED/null).
      entries: The ipAllowListEntries.nodes list from GraphQL.

  copilot_policy:
    endpoint: GET /orgs/{org}/copilot/billing
    docs: https://docs.github.com/en/rest/copilot/copilot-user-management
    returns:
      - public_code_suggestions
      - seat_management_setting
    synthetic: {}

  copilot_seat:
    endpoint: GET /orgs/{org}/copilot/billing/seats
    docs: https://docs.github.com/en/rest/copilot/copilot-user-management
    returns:
      - assignee
      - created_at
      - last_activity_at
      - last_activity_editor
    synthetic: {}

  approved_pat:
    endpoint: GET /orgs/{org}/personal-access-tokens
    docs: https://docs.github.com/en/rest/orgs/personal-access-tokens
    returns:
      - access_granted_at
      - owner
      - permissions
      - repository_selection
      - token_expired
      - token_last_used_at
    synthetic: {}

  org_package:
    endpoint: GET /orgs/{org}/packages?package_type={type}
    docs: https://docs.github.com/en/rest/packages/packages#list-packages-for-an-organization
    returns:
      - name
      - package_type
      - visibility
      - repository
    synthetic:
      repository_private: Extracted from repository.private by the collector.

  dependabot_alert:
    endpoint: GET /repos/{owner}/{repo}/dependabot/alerts?state=open
    docs: https://docs.github.com/en/rest/dependabot/alerts
    returns: []
    synthetic:
      open_alert_count: >-
        Collector-computed count of open alerts. Alert contents are never
        collected -- enablement and counts are posture, alert bodies are ASPM.

  code_scanning_alert:
    endpoint: GET /repos/{owner}/{repo}/code-scanning/alerts?state=open
    docs: https://docs.github.com/en/rest/code-scanning/code-scanning
    returns: []
    synthetic:
      open_alert_count: >-
        Collector-computed count of open alerts. Alert contents are never
        collected -- enablement and counts are posture, alert bodies are ASPM.

  repo_vulnerability_alerts:
    endpoint: GET /repos/{owner}/{repo}/vulnerability-alerts
    docs: https://docs.github.com/en/rest/repos/repos#check-if-vulnerability-alerts-are-enabled-for-a-repository
    returns: []
    synthetic:
      enabled: >-
        Collector-computed. A 204 (success, no body) means enabled=true; a 404
        means disabled=false (that is the finding). A 403 is reduced coverage
        (permission denied) rather than a finding; it is skipped via is_skippable.

  repo_code_scanning:
    endpoint: GET /repos/{owner}/{repo}/code-scanning/default-setup
    docs: https://docs.github.com/en/rest/code-scanning/code-scanning#get-a-code-scanning-default-setup-configuration
    returns:
      - languages
      - query_suite
      - state
    synthetic: {}
