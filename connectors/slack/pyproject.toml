[project]
name = "kestrel-connector-slack"
version = "0.3.0"
description = "Kestrel connector for Slack workspaces."
license = "Apache-2.0"
authors = [{name = "The Kestrel Authors"}]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
requires-python = ">=3.12"
dependencies = [
    "kestrel",
]

[project.urls]
Homepage = "https://github.com/kestrel-security/kestrel"
Repository = "https://github.com/kestrel-security/kestrel"
Issues = "https://github.com/kestrel-security/kestrel/issues"
Documentation = "https://github.com/kestrel-security/kestrel/tree/main/docs"
Changelog = "https://github.com/kestrel-security/kestrel/blob/main/CHANGELOG.md"

[project.entry-points."kestrel.connectors"]
slack = "kestrel_connector_slack.connector:SlackConnector"

[tool.uv.sources]
kestrel = { workspace = true }

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kestrel_connector_slack"]
