# Scrape Kestrel API + worker Prometheus endpoints (local Docker Compose profile).
# Start with: docker compose --profile observability up
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: kestrel-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: kestrel-api

  - job_name: kestrel-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]
        labels:
          service: kestrel-worker
