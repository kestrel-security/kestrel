name: Feature request
description: Propose a change that is not already tracked in an issue
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Search [open issues](https://github.com/kestrel-security/kestrel/issues) first so we do not duplicate work.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can a security team not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest complete slice that would help. Prefer describing behavior, not a rewrite.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
