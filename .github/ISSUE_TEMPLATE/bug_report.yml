name: Bug report
description: Report a defect in Kestrel (not a security vulnerability)
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities belong in a [private advisory](https://github.com/kestrel-security/kestrel/security/advisories/new), not a public issue. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Minimal steps, commands, or a fixture that shows the bug.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Tag, commit SHA, or `main` at YYYY-MM-DD.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Node versions, Compose or your own images, anything else relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs / evidence
      description: Redact secrets, tokens, and tenant data before pasting.
