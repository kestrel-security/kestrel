name: Security scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Docs-only pull requests skip the dependency audits; gitleaks always runs.
  # The weekly schedule is not a pull request, so it audits regardless.
  # scripts/ci-changes.sh decides; it answers false for anything but a pull
  # request, so pushes to main and the release gate always run everything.
  #
  # Skipped jobs still satisfy the required checks in the main-pr ruleset,
  # which is why the workflow runs on every pull request instead of using
  # paths-ignore (a workflow that never starts leaves required checks pending).
  # Gated jobs use `!cancelled()`, so if this job fails they run rather than
  # skip: a broken classifier costs time, never coverage.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-changes.sh "$BASE" "$HEAD"

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.18"
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install workspace
        run: uv sync --locked
      - name: Audit Python dependencies
        run: bash scripts/audit-python.sh

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` here on purpose. pnpm/action-setup refuses to start when
      # the action config and package.json's `packageManager` disagree, which is
      # what had been failing this workflow. Omitting it makes `packageManager`
      # the single source of truth, so the two cannot drift again.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit Node dependencies
        run: pnpm audit --audit-level=high

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so a secret introduced and then removed within one
          # pull request is still caught.
          fetch-depth: 0
      # The gitleaks GitHub Action requires a paid license key on
      # organization-owned repositories, so this runs the pinned release binary
      # directly and verifies its checksum. Bump both values together from
      # https://github.com/gitleaks/gitleaks/releases.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
      - name: Scan for secrets
        run: gitleaks git --no-banner --redact --exit-code 1 --config .gitleaks.toml .

  # The three Trivy image scans moved to .github/workflows/nightly.yaml.
  # They rebuilt all three Docker images from scratch, uncached, on every pull
  # request -- the single largest item on the PR path. They still block, and
  # still run on a schedule; they just no longer gate a PR on a container
  # rebuild. See docs/testing.md for the tier split.
