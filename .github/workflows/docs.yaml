name: Docs site

# Builds docs.kestrelsecurity.io from a release tag and deploys it to GitHub
# Pages. The site always shows the latest release (docs/operations/release-process.md):
#
#   release.yaml .. calls this after the GitHub Release for every vX.Y.Z tag;
#                   a pre-release (vX.Y.Z-rc.1) does not replace the site
#   dispatch ...... redeploys a given tag by hand (first deploy, a re-run)
#
# Links that leave docs/ point at the same tag on GitHub (docs-site/hooks.py).
# Deploys with the Pages OIDC token: no stored secret.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        type: string
        required: true

# One deploy at a time; a newer tag queued behind an older one still wins.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Tag is a release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::'$TAG' is not a release tag (vX.Y.Z); pre-releases are not published"
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.18"
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: uv sync --only-group docs --locked
      - name: Build
        env:
          KESTREL_DOCS_REF: ${{ inputs.tag }}
        run: uv run --only-group docs mkdocs build --strict
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Writes only the Pages deployment, never the repository.
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
