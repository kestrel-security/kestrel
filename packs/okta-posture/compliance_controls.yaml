# Built-in compliance control catalog for okta-posture.
# CISA OKTA-* IDs paraphrase SCuBA / Okta hardening intent for UI mapping.
controls:
  - framework: custom
    control_id: OKTA-01
    title: Require MFA enrollment and strong password policy
    description: >
      Okta orgs should require multifactor enrollment and enforce strong
      password policies so stolen passwords alone cannot access the tenant.
  - framework: custom
    control_id: OKTA-02
    title: Privileged Okta admin hygiene
    description: >
      Privileged Okta administrators must not remain disabled or dormant
      while retaining elevated roles.
  - framework: custom
    control_id: OKTA-03
    title: Prefer modern app sign-on over SWA/bookmark
    description: >
      Prefer SAML/OIDC apps; bookmark and SWA apps lack federation controls.
  - framework: custom
    control_id: OKTA-04
    title: Rotate unused API tokens and require MFA for admins
    description: >
      Unused API tokens should be revoked; privileged admins must use MFA.
  - framework: custom
    control_id: OKTA-05
    title: Monitor Okta threat detections
    description: >
      Okta System Log threat detections should be reviewed promptly.
  - framework: soc2
    control_id: CC7.2
    title: Anomaly and security event monitoring
    description: >
      The entity monitors system components for anomalies and security events.
  - framework: soc2
    control_id: CC6.1
    title: Logical access security
    description: >
      The entity implements logical access security software, infrastructure,
      and architectures over protected information assets to protect them
      from security events.
  - framework: soc2
    control_id: CC6.2
    title: Access provisioning and authentication
    description: >
      Prior to issuing system credentials and granting system access, the
      entity registers and authorizes new internal and external users whose
      access is administered by the entity.
  - framework: soc2
    control_id: CC6.3
    title: Role-based access removal and modification
    description: >
      The entity authorizes, modifies, or removes access to data, software,
      functions, and other protected information assets based on roles,
      responsibilities, or the system design and changes, giving
      consideration to the concept of least privilege.
  - framework: custom
    control_id: OKTA-06
    title: API token creation is attributable
    description: >
      An Okta API token inherits its creator's permissions, does not expire by
      default, and is not covered by MFA. Each one should trace to a change.
  - framework: custom
    control_id: OKTA-07
    title: Privilege revocation is visible
    description: >
      Admin role removals are recorded, so the privilege story is not
      grant-only and an unexpected revocation can be reviewed.
  - framework: custom
    control_id: OKTA-08
    title: Device assurance requires disk encryption
    description: >
      Device assurance policies should require full-disk encryption so a lost
      device does not surrender cached credentials and session tokens.
  - framework: custom
    control_id: OKTA-09
    title: Passwords exclude the username
    description: >
      Password policy should screen out the user's own name. NIST SP 800-63B
      prefers context-specific screening over composition rules.
  - framework: cis
    control_id: "6.3"
    title: Require MFA for externally-exposed applications
    description: >
      Require multi-factor authentication for externally-exposed
      applications.
  - framework: cis
    control_id: "6.8"
    title: Define and maintain role-based access control
    description: >
      Define and maintain role-based access control, through determining and
      documenting the access rights necessary for each role within the
      enterprise to successfully carry out its assigned duties.
  - framework: nist_csf
    control_id: PR.AC-1
    title: Identity and credential management
    description: >
      Identities and credentials are issued, managed, verified, revoked, and
      audited for authorized devices, users, and processes.
  - framework: nist_csf
    control_id: PR.AC-3
    title: Remote access management
    description: >
      Remote access is managed.
  - framework: nist_csf
    control_id: PR.AC-4
    title: Least-privilege access permissions
    description: >
      Access permissions and authorizations are managed, incorporating the
      principles of least privilege and separation of duties.
  - framework: nist_csf
    control_id: PR.AC-7
    title: Authentication commensurate with risk
    description: >
      Users, devices, and other assets are authenticated (e.g. single-factor,
      multi-factor) commensurate with the risk of the transaction.
  - framework: nist_csf
    control_id: DE.CM-1
    title: Network and physical continuous monitoring
    description: >
      The network is monitored to detect potential cybersecurity events.
  - framework: cis
    control_id: "5.2"
    title: Use unique passwords
    description: >
      Use unique passwords for all enterprise assets. Longer passwords where
      multi-factor authentication is not supported.
  - framework: cis
    control_id: "6.7"
    title: Centralize access control
    description: >
      Centralize access control for enterprise systems through directory
      services or SSO.
  - framework: custom
    control_id: OKTA-B01
    title: Behavior detection evaluates sign-in
    description: >
      Okta behavior detections should be active and evaluated on sign-in so
      anomalous location and device signals can challenge a session.
  - framework: custom
    control_id: OKTA-B02
    title: System Log is streamed off-platform
    description: >
      An inactive log stream leaves Okta audit events only in the tenant.
  - framework: custom
    control_id: OKTA-B03
    title: Authorization server token lifetimes stay short
    description: >
      Long-lived access tokens extend the window a stolen token remains useful.
  - framework: custom
    control_id: OKTA-B04
    title: Authorization server scopes are explicit
    description: >
      A wildcard scope grants every resource the authorization server protects.
  - framework: custom
    control_id: OKTA-B05
    title: Super administrator count stays in range
    description: >
      Too few super administrators is a lockout risk; too many widens the
      blast radius of one compromised account.
  - framework: custom
    control_id: OKTA-B06
    title: Authentication policy changes are reviewed
    description: >
      Deactivating or deleting a sign-on or MFA policy weakens authentication.
  - framework: custom
    control_id: OKTA-B07
    title: Admin impersonation is detected
    description: >
      A session started by impersonation is an administrative action that
      should be reviewed.
  - framework: custom
    control_id: OKTA-B08
    title: Network zone changes are detected
    description: >
      Updating or deleting a network zone changes which addresses are trusted.
  - framework: cis
    control_id: "5.4"
    title: Restrict administrator privileges to dedicated accounts
    description: >
      Super administrator grants and impersonation sessions are privileged
      actions and should stay limited.
  - framework: cis
    control_id: "8.9"
    title: Centralize audit log management
    description: >
      Okta System Log events should be streamed to a central log store.
  - framework: cis
    control_id: "8.11"
    title: Conduct audit log reviews
    description: >
      Behavior detection has to be active for anomalous sign-ins to appear
      in the events an operator reviews.
  - framework: cisa
    control_id: CISA-SAC-1
    title: Limit the number of super administrators
    description: >
      Keep the set of Okta super administrators small enough to monitor and
      large enough that one absence does not lock the tenant.
  - framework: nist_csf
    control_id: DE.AE-2
    title: Detected events are analyzed
    description: >
      Policy, zone, and impersonation events in the System Log are events
      that should be analyzed.
  - framework: nist_csf
    control_id: DE.AE-3
    title: Event data are collected and correlated
    description: >
      A log stream is what makes Okta events available for correlation
      outside the tenant.
  - framework: nist_csf
    control_id: PR.AC-6
    title: Identities are proofed and bound to credentials
    description: >
      Super administrator assignment and impersonation change which identity
      is acting with privileged credentials.
