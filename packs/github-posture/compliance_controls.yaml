# Built-in compliance control catalog for github-posture.
# Rows are installed with org_id = null (shared across all orgs).
controls:
  - framework: custom
    control_id: GH-EXT-01
    title: Outside collaborators do not hold write access to sensitive repositories
    description: >
      Collaborators from outside the organization are not covered by its SSO,
      MFA requirement, or offboarding, and must not be able to push to
      repositories holding production, secret, or customer data.
  - framework: custom
    control_id: GH-01
    title: Require MFA for GitHub organization administrators
    description: >
      Privileged GitHub organization administrators must use multi-factor
      authentication so a stolen password alone cannot administer the org.
  - framework: custom
    control_id: GH-02
    title: Remove privileged access from disabled GitHub accounts
    description: >
      Disabled or suspended GitHub identities must not retain organization
      administrator roles or other elevated grants.
  - framework: custom
    control_id: GH-03
    title: Restrict external privileged access on GitHub
    description: >
      Outside collaborators and external identities should not hold
      organization admin roles or repository admin grants without explicit
      exception and review.
  - framework: custom
    control_id: GH-04
    title: Prefer team-mediated repository admin grants
    description: >
      Direct repository admin grants bypass team-based access review;
      prefer group-mediated grants and least privilege.
  - framework: custom
    control_id: GH-05
    title: Require MFA for GitHub repository administrators
    description: >
      Identities with repository admin grants (direct or team-mediated)
      must use multi-factor authentication so a stolen password alone
      cannot administer sensitive repositories.
  - framework: custom
    control_id: GH-06
    title: Remove repository admin grants from disabled GitHub accounts
    description: >
      Disabled or suspended GitHub identities must not retain repository
      administrator grants (direct or team-mediated).
  - framework: custom
    control_id: GH-07
    title: Require organization-wide 2FA on GitHub
    description: >
      GitHub organizations should require two-factor authentication for all
      members so a stolen password alone cannot access the org.
  - framework: custom
    control_id: GH-08
    title: Restrict default repository permission
    description: >
      Organization default repository permission should not be admin; prefer
      read or none and grant elevated access via teams.
  - framework: custom
    control_id: GH-09
    title: Restrict member creation of public repositories
    description: >
      Members should not be able to create public repositories without
      administrative control, reducing accidental data exposure.
  - framework: soc2
    control_id: CC6.1
    title: Logical access security
    description: >
      The entity implements logical access security software, infrastructure,
      and architectures over protected information assets to protect them
      from security events.
  - framework: soc2
    control_id: CC6.2
    title: Access provisioning and authentication
    description: >
      Prior to issuing system credentials and granting system access, the
      entity registers and authorizes new internal and external users whose
      access is administered by the entity.
  - framework: soc2
    control_id: CC6.3
    title: Role-based access removal and modification
    description: >
      The entity authorizes, modifies, or removes access to data, software,
      functions, and other protected information assets based on roles,
      responsibilities, or the system design and changes, giving
      consideration to the concept of least privilege.
  - framework: cis
    control_id: "6.3"
    title: Require MFA for externally-exposed applications
    description: >
      Require multi-factor authentication for externally-exposed
      applications.
  - framework: cis
    control_id: "6.8"
    title: Define and maintain role-based access control
    description: >
      Define and maintain role-based access control, through determining and
      documenting the access rights necessary for each role within the
      enterprise to successfully carry out its assigned duties.
  - framework: nist_csf
    control_id: PR.AC-1
    title: Identity and credential management
    description: >
      Identities and credentials are issued, managed, verified, revoked, and
      audited for authorized devices, users, and processes.
  - framework: nist_csf
    control_id: PR.AC-3
    title: Remote access management
    description: >
      Remote access is managed.
  - framework: nist_csf
    control_id: PR.AC-4
    title: Least-privilege access permissions
    description: >
      Access permissions and authorizations are managed, incorporating the
      principles of least privilege and separation of duties.
  - framework: nist_csf
    control_id: PR.AC-7
    title: Authentication commensurate with risk
    description: >
      Users, devices, and other assets are authenticated (e.g. single-factor,
      multi-factor) commensurate with the risk of the transaction.
  - framework: nist_csf
    control_id: DE.CM-1
    title: Network and physical continuous monitoring
    description: >
      The network is monitored to detect potential cybersecurity events.
  - framework: cis
    control_id: "5.2"
    title: Use unique passwords
    description: >
      Use unique passwords for all enterprise assets. Longer passwords where
      multi-factor authentication is not supported.
  - framework: cis
    control_id: "6.7"
    title: Centralize access control
    description: >
      Centralize access control for enterprise systems through directory
      services or SSO.
  - framework: cis
    control_id: "5.1"
    title: Establish and maintain an inventory of accounts
    description: >
      Organization members, outside collaborators, service identities, and
      pending invitations must all be inventoried, including the access each
      one carries.
  - framework: cis
    control_id: "5.3"
    title: Disable dormant accounts and credentials
    description: >
      Credentials that are no longer used, including SSO-authorized personal
      access tokens and SSH keys, must be revoked rather than left standing.
  - framework: cis
    control_id: "5.6"
    title: Centralize account management
    description: >
      Access should be governed through the identity provider. Disabling or
      reconfiguring SAML single sign-on moves authentication outside it.
  - framework: soc2
    control_id: CC6.6
    title: Logical access controls against threats from outside the boundary
    description: >
      Build infrastructure reachable from public repositories, such as
      self-hosted runners open to fork pull requests, extends the trust
      boundary to untrusted code.
  - framework: soc2
    control_id: CC6.7
    title: Restrict the transmission and movement of information
    description: >
      Organization events delivered to external destinations must travel over
      verified TLS, and their destinations must be known and expected.
  - framework: soc2
    control_id: CC8.1
    title: Change management
    description: >
      Changes to protected branches, rulesets, and CI configuration must be
      authorized and reviewed, and protection must actually enforce rather
      than merely evaluate.
  - framework: nist_csf
    control_id: PR.AC-5
    title: Network integrity is protected through segregation
    description: >
      Build infrastructure should be segregated from untrusted workloads;
      a shared runner group reachable from public repositories is not.
  - framework: nist_csf
    control_id: PR.DS-2
    title: Data in transit is protected
    description: >
      Webhook deliveries carrying organization events must verify TLS.
  - framework: nist_csf
    control_id: PR.IP-1
    title: A baseline configuration is created and maintained
    description: >
      Branch protection, rulesets, and Actions permissions form the repository
      security baseline, and drift from it must be detected.
  - framework: nist_csf
    control_id: DE.CM-7
    title: Monitoring for unauthorized connections, devices, and software
    description: >
      Newly installed Apps, webhooks, deploy keys, and self-hosted runners are
      unauthorized-software and unauthorized-connection surfaces.
  - framework: cis
    control_id: "3.1"
    title: Establish and maintain a data management process
    description: >
      Required status checks are part of the process that keeps untested
      changes out of the default branch.
  - framework: cis
    control_id: "5.4"
    title: Restrict administrator privileges to dedicated accounts
    description: >
      Custom roles and code-scanning gaps concentrate or hide privileged
      change paths; administrator-level capability should stay narrow.
  - framework: cis
    control_id: "6.1"
    title: Establish an access granting process
    description: >
      Fine-grained PAT approvals and the IP allow list are how organization
      access is granted and constrained.
  - framework: custom
    control_id: GH-13
    title: Stream the organization audit log
    description: >
      Audit events should leave GitHub for a retained destination so they
      outlast the provider's own retention window.
  - framework: nist_csf
    control_id: ID.RA-1
    title: Asset vulnerabilities are identified and documented
    description: >
      Dependabot alerts and code scanning are how repository vulnerabilities
      are identified.
  - framework: nist_csf
    control_id: DE.AE-2
    title: Detected events are analyzed
    description: >
      Vulnerability alerts have to be enabled before detected dependency
      issues can be analyzed.
  - framework: nist_csf
    control_id: DE.AE-3
    title: Event data are collected and correlated
    description: >
      Audit log streaming is what makes GitHub events available for
      correlation outside the product.
  - framework: nist_csf
    control_id: PR.DS-5
    title: Protections against data leaks are implemented
    description: >
      A public package published from a private repository is a data leak
      path.
  - framework: nist_csf
    control_id: PR.IP-12
    title: A vulnerability management plan is developed and implemented
    description: >
      Open Dependabot alerts are unresolved items in the vulnerability
      management plan.
  - framework: nist_csf
    control_id: PR.PT-1
    title: Audit and log records are determined, documented, implemented, and reviewed
    description: >
      Streaming the organization audit log is the implementation of that
      record.
