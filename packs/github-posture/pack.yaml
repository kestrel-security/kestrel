name: github-posture
version: "0.4.0"
display_name: GitHub Posture
summary: >
  MFA, privileged access, supply chain, org settings, and audit activity for
  GitHub.
description: >
  GitHub organization and repository posture: MFA for admins, external and
  disabled privileged access, direct grants, org 2FA and default permissions.
  Supply chain: the default GITHUB_TOKEN scope, third-party Actions, runner
  groups reachable from public repositories, org secret visibility, webhooks
  delivering without TLS verification, installed Apps holding sensitive
  permissions, and rulesets that evaluate without enforcing. Plus Copilot
  policy (public code suggestions, inactive seats), IP allow list, approved
  fine-grained PATs with admin permissions, public packages from private repos,
  open Dependabot and code-scanning alert counts, code scanning setup state,
  vulnerability alert enablement, and required status checks. Activity
  detections cover privilege change, branch-protection removal, repositories
  made public, SSO changes, App installs, webhooks, deploy keys, Copilot seat
  changes, OIDC changes, and audit log streaming configuration. Mapped to
  CIS / NIST CSF / SOC2 / CISA SCuBA-style controls where collected data
  supports it.
application: github
categories:
  - identity
  - privileged_access
  - supply_chain
  - tenant_settings
  - activity
frameworks:
